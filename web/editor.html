<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio content editor</title><link rel="stylesheet" href="styles.css"><style>body{background:var(--soft)}main{max-width:1000px;margin:50px auto;padding:0 24px}h1{font-size:2rem}textarea{display:block;width:100%;height:60vh;padding:20px;border:1px solid var(--border);background:white;font-family:monospace;font-size:13px;line-height:1.6;border-radius:9px;margin:25px 0;direction:ltr}#status{margin-top:20px;color:var(--primary);white-space:pre-wrap}.notice{padding:18px 22px;background:white;border-inline-start:3px solid var(--accent)}.actions{margin-top:20px}label{font-size:.8rem;display:block;margin:20px 0}</style><script src="editor.js" defer></script></head><body><main><p class="eyebrow">MAINTAINER TOOL</p><h1>Portfolio content editor</h1><p class="notice">This editor prepares a content file. Changes stay in this browser until you export <strong>portfolio.json</strong>, replace <strong>content/portfolio.json</strong> in the repository, and publish the update. It does not save changes to the live website.</p><label>Import an existing content file <input id="import-file" type="file" accept="application/json,.json"></label><label for="content-editor">Portfolio content (English and Arabic)</label><textarea id="content-editor" spellcheck="false" aria-describedby="status"></textarea><div class="actions"><button id="save-draft" class="btn secondary" type="button">Save local draft</button><button id="export-content" class="btn primary" type="button">Validate & export content</button><button id="reset-content" class="btn secondary" type="button">Reload published content</button><a class="text-link" href="en/">Open portfolio ↗</a></div><p role="status" id="status" aria-live="polite"></p></main></body></html>
